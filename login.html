<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="IT solutions,Software development,Cloud computing,Cybersecurity services,
                                    IT consulting,Managed IT services,Web development,Mobile app development,Digital transformation,Data analytics,Network security,Enterprise solutions,Cloud migration,DevOps services,
                                    IT infrastructure management,Custom software solutions,Business technology consulting,Artificial intelligence (AI) solutions,
                                    Blockchain development,Tech support services">
    <meta name="description" content="At Visionary Creations , we specialize in delivering innovative IT solutions to help businesses thrive in the digital era. From software development to cloud computing and cybersecurity, our expert team is dedicated to driving your business forward with cutting-edge technology and personalized services.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="/imgs/logo.png" type="image/png">
    <script src="tailwind.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body{
            font-family: 'Fira Sans', sans-serif;
        }
    </style>
</head>
<body>
    <section class="relative min-h-screen flex items-center justify-center">
        <div class="absolute inset-0">
            <img src="imgs/header.webp" alt="background" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-[#212529] opacity-65 "></div>
        </div>

        <!-- Login Card -->
        <div class="relative z-10 bg-white p-8 rounded-lg w-full max-w-md">
            <!-- Header Section -->
            <div class="text-center mb-8">
                <h1 class="text-2xl font-semibold text-gray-900 mb-6">Log In</h1>
                <!-- User Icon -->
                <div class="inline-block p-3 rounded-full">
                    <img src="imgs/login.png" alt="login icon" class="w-20 h-20">
                </div>
            </div>

            <!-- Login Form -->
            <form class="space-y-6">
                <div>
                    <input type="email" placeholder="Email" class="w-full px-4 py-2 border border-gray-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent" required>
                </div>
                <div>
                    <input type="password" minlength="8" placeholder="Password" class="w-full px-4 py-2 border border-gray-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent" required>
                </div>
                <!--Checkbox -->
                <div class="flex items-center">
                    <input type="checkbox" id="remember" class="h-4 w-4 text-teal-600 focus:ring-teal-500 border-gray-300 rounded">
                    <label for="remember" class="ml-2 block text-sm text-gray-900">Remember me</label>
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2">
                    LOGIN
                </button>

                <!-- Forgot Password Link -->
                <p class="text-center text-sm text-gray-600">
                    <a href="#">Forgot Password?</a>
                </p>
            </form>
        </div>
    </section>
</body>
</html>
